<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (e) {
            var src = (e && e.filename) || '';
            var stack = (e && e.error && e.error.stack) || '';
            if (src.indexOf('chrome-extension://') === 0 || stack.indexOf('chrome-extension://') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        try {
          var d = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (d && d.configurable && !d.writable && !d.set && typeof d.get === 'function') {
            var origGet = d.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: d.enumerable,
              get: origGet,
              set: function () {}
            });
          }
        } catch (_) {}
      })();
    </script>
